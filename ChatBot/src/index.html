<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 聊天助手</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .wechat-bg { background-color: #f5f5f5; }
    </style>
</head>
<body class="bg-gray-200 h-screen flex items-center justify-center p-4">

<div id="app" class="w-full max-w-6xl h-full flex bg-white shadow-2xl rounded-lg overflow-hidden">

    <!-- 左侧会话列表 -->
    <div class="w-1/4 bg-[#f2f2f2] border-r border-gray-300 flex flex-col text-gray-900">
        <div class="p-4 bg-[#f2f2f2] flex justify-between items-center">
            <h2 class="text-lg font-normal">消息</h2>
            <button @click="createNewSession" class="text-2xl text-gray-600 hover:text-green-500 font-light" title="新建会话">+</button>
        </div>

        <div class="flex-1 overflow-y-auto no-scrollbar">
            <div v-for="session in sessions" :key="session.id"
                 @click="switchSession(session.id)"
                 :class="['group px-4 py-3 border-b border-gray-200/60 cursor-pointer hover:bg-[#dedede] transition-colors relative',
                          currentSessionId === session.id ? 'bg-[#c6c6c6]' : '']">
                <div class="flex justify-between items-baseline mb-1">
                    <div class="text-[17px] text-gray-900 truncate flex-1 font-normal">{{ session.id }}</div>
                    <div class="flex items-center space-x-2 flex-shrink-0">
                        <div class="text-[12px] text-gray-400">{{ formatTime(session.timestamp) }}</div>
                        <button @click.stop="deleteSession(session.id)"
                                class="text-gray-500 hover:text-red-500 text-sm hidden group-hover:block ml-1"
                                title="删除角色">✖</button>
                    </div>
                </div>
                <div class="text-[13px] text-[#999999] truncate w-[90%]">{{ session.last_message || '暂无消息' }}</div>
            </div>

            <div v-if="sessions.length === 0" class="p-4 text-gray-400 text-sm text-center mt-4">
                暂无聊天
            </div>
        </div>
    </div>

    <!-- 右侧主聊天区域 -->
    <div class="flex-1 flex flex-col wechat-bg relative min-w-0">
        <div class="h-16 bg-gray-100 border-b flex justify-between items-center px-6">
            <h2 class="text-xl font-bold text-gray-800 truncate pr-4">{{ currentSessionId || '请选择或创建会话' }}</h2>
            <div class="space-x-2 flex-shrink-0" v-if="currentSessionId">
                <button @click="openSummary" class="px-3 py-1 bg-blue-500 text-white rounded hover:bg-blue-600 text-sm">查看摘要</button>
                <button @click="showPersonalityModal = true" class="px-3 py-1 bg-purple-500 text-white rounded hover:bg-purple-600 text-sm">修改人设</button>
                <button @click="clearHistory" class="px-3 py-1 bg-red-500 text-white rounded hover:bg-red-600 text-sm">清空记忆</button>
            </div>
        </div>

        <!-- 聊天记录 -->
        <div class="flex-1 overflow-y-auto p-6 space-y-4" id="chat-box">
            <div v-for="(msg, index) in messages" :key="index" :class="['flex', msg.role === 'user' ? 'justify-end' : 'justify-start']">
                <div :class="['max-w-[70%] p-3 rounded-lg shadow whitespace-pre-wrap',
                             msg.role === 'user' ? 'bg-green-400 text-black rounded-tr-none' : 'bg-white text-black rounded-tl-none']">
                    {{ msg.content }}

                    <div v-if="msg.role === 'assistant'" class="mt-3 pt-2 border-gray-200 flex justify-end">
                        <button @click="playVoice(msg.content, index)"
                        :disabled="msg.isPlaying"
                        class="px-3 py-1 text-xs rounded-full transition-colors"
                        :class="[
                            msg.isPlaying ? 'bg-gray-400 text-white cursor-not-allowed' : 'bg-blue-500 text-white hover:bg-blue-600'
                        ]">
                            {{ msg.isPlaying ? '生成中...' : '播放语音' }}
                        </button>
                    </div>
                </div>
            </div>
            <div v-if="isLoading" class="flex justify-start">
                <div class="bg-white p-3 rounded-lg shadow rounded-tl-none text-gray-500 text-sm">
                    对方正在输入...
                </div>
            </div>
        </div>

        <!-- 输入区 -->
        <div class="h-40 bg-white border-t p-4 flex flex-col">
            <textarea v-model="inputMessage" @keyup.enter.exact="sendMessage" :disabled="!currentSessionId || isLoading"
                      class="flex-1 resize-none outline-none text-lg p-2 no-scrollbar"
                      placeholder="Enter 发送，Shift+Enter 换行"></textarea>
            <div class="flex items-center justify-between mt-2">
                <div class="flex items-center space-x-2">
                    <button @click="toggleVoiceCall" :disabled="!currentSessionId"
                            :class="['px-4 py-2 round-full text-sm font-medium transition-colors',
                                    isInCall ? 'bg-red-500 hover:bg-red-600 text-white' : 'bg-blue-500 hover:bg-blue-600 text-white',
                                    !currentSessionId ? 'opacity-50 cursor-not-allowed' : '']">
                    <span v-if="isInCall">⏹ 挂断</span>
                    <span v-else>🎙️ 语音通话</span>
                    </button>
                    <span v-if="isInCall" class="text-sm text-green-600 font-semibold animate-pulse">● 通话中</span>
                </div>
                <button @click="sendMessage" :disabled="!currentSessionId || isLoading || !inputMessage.trim()"
                        class="px-6 py-2 bg-green-500 text-white rounded hover:bg-green-600 disabled:bg-gray-300 transition-colors">发送 (Enter)
                </button>
            </div>
        </div>

        <!-- 模态框：修改人设 -->
        <div v-if="showPersonalityModal" class="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
            <div class="bg-white p-6 rounded-lg w-1/2">
                <h3 class="text-xl font-bold mb-4">修改人设 (Prompt)</h3>
                <textarea v-model="tempPersonality" class="w-full h-40 border p-2 mb-4 focus:outline-blue-500" placeholder="输入新的人设..."></textarea>
                <div class="flex justify-end space-x-2">
                    <button @click="showPersonalityModal = false" class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">取消</button>
                    <button @click="updatePersonality" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">保存</button>
                </div>
            </div>
        </div>

        <!-- 模态框：查看摘要 -->
        <div v-if="showSummaryModal" class="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
            <div class="bg-white p-6 rounded-lg w-1/2">
                <h3 class="text-xl font-bold mb-4">当前记忆摘要</h3>
                <div class="w-full h-64 overflow-y-auto border p-4 bg-gray-50 mb-4 whitespace-pre-wrap">{{ currentSummary || '暂无摘要' }}</div>
                <div class="flex justify-end">
                    <button @click="showSummaryModal = false" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">关闭</button>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    const { createApp, ref, onMounted, nextTick } = Vue;

    createApp({
        setup() {
            const sessions = ref([]);
            const currentSessionId = ref('');
            const messages = ref([]);
            const inputMessage = ref('');
            const isLoading = ref(false);

            const showPersonalityModal = ref(false);
            const showSummaryModal = ref(false);
            const tempPersonality = ref('');
            const currentSummary = ref('');

            // 语音通话相关
            const isInCall = ref(false);
            const recognition = ref(null);
            const ws = ref(null);
            const wsReady = ref(false);
            const isAiSpeaking = ref(false);

            // ========== 会话管理 ==========
            const fetchSessions = async () => {
                try {
                    const res = await fetch('/api/sessions');
                    if (!res.ok) throw new Error(`后端错误: ${res.status}`);
                    const data = await res.json();
                    sessions.value = data || [];

                    if (!currentSessionId.value && sessions.value.length > 0) {
                        switchSession(sessions.value[0].id);
                    }
                } catch (error) {
                    console.error("拉取会话列表失败:", error);
                    sessions.value = [];
                }
            };

            const switchSession = async (id) => {
                currentSessionId.value = id;
                try {
                    const res = await fetch(`/api/history?session_id=${id}`);
                    messages.value = await res.json();
                    scrollToBottom();
                } catch (e) {
                    console.error("历史记录加载失败");
                }
            };

            const createNewSession = () => {
                const newId = prompt("请输入新角色/会话的ID：");
                if (newId && newId.trim()) {
                    fetch('/api/sessions', {
                        method: 'POST',
                        body: JSON.stringify({ session_id: newId.trim() })
                    }).then(() => {
                        currentSessionId.value = '';
                        switchSession(newId.trim());
                        fetchSessions();
                    });
                }
            };

            const deleteSession = async (id) => {
                if (confirm(`确定要永久删除角色 "${id}" 及其所有历史记录吗？`)) {
                    try {
                        await fetch('/api/delete_session', {
                            method: 'POST',
                            body: JSON.stringify({ session_id: id })
                        });
                        if (currentSessionId.value === id) {
                            currentSessionId.value = '';
                            messages.value = [];
                            currentSummary.value = '';
                        }
                        fetchSessions();
                    } catch (e) {
                        alert("删除失败，请检查网络或后端状态。");
                    }
                }
            };

            const clearHistory = async () => {
                if (confirm("确定清空当前会话的记忆吗？")) {
                    await fetch('/api/clear', {
                        method: 'POST',
                        body: JSON.stringify({ session_id: currentSessionId.value })
                    });
                    messages.value = [];
                    fetchSessions();
                }
            };

            const updatePersonality = async () => {
                await fetch('/api/personality', {
                    method: 'POST',
                    body: JSON.stringify({ session_id: currentSessionId.value, prompt: tempPersonality.value })
                });
                showPersonalityModal.value = false;
                fetchSessions();
            };

            const openSummary = async () => {
                if (!currentSessionId.value) return;
                const res = await fetch(`/api/summary?session_id=${currentSessionId.value}`);
                const data = await res.json();
                currentSummary.value = data.summary;
                showSummaryModal.value = true;
            };

            const updateLocalSessionPreview = (id, text) => {
                const session = sessions.value.find(s => s.id === id);
                if (session) session.last_message = text;
            };

            const formatTime = (timeStr) => {
                if (!timeStr) return '刚刚';
                const date = new Date(timeStr.replace(/-/g, '/'));
                if (isNaN(date.getTime())) return '';

                const now = new Date();
                const isToday = date.toDateString() === now.toDateString();

                if (isToday) {
                    return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                } else {
                    const month = (date.getMonth() + 1).toString().padStart(2, '0');
                    const day = date.getDate().toString().padStart(2, '0');
                    return `${month}/${day}`;
                }
            };

            const scrollToBottom = () => {
                nextTick(() => {
                    const box = document.getElementById('chat-box');
                    if (box) box.scrollTop = box.scrollHeight;
                });
            };

            // ========== 文字聊天 ==========
            const sendMessage = async () => {
                if (!inputMessage.value.trim() || !currentSessionId.value) return;

                const userText = inputMessage.value.trim();
                messages.value.push({ role: 'user', content: userText });
                inputMessage.value = '';
                isLoading.value = true;
                scrollToBottom();

                updateLocalSessionPreview(currentSessionId.value, userText);

                try {
                    const res = await fetch('/api/chat', {
                        method: 'POST',
                        body: JSON.stringify({ session_id: currentSessionId.value, message: userText })
                    });
                    const data = await res.json();
                    messages.value.push({ role: 'assistant', content: data.reply, isPlaying: false });
                    updateLocalSessionPreview(currentSessionId.value, data.reply);
                } catch (e) {
                    messages.value.push({ role: 'assistant', content: '网络错误，请检查后端。' });
                } finally {
                    isLoading.value = false;
                    scrollToBottom();
                    fetchSessions();
                }
            };

            // ========== 手动播放某条 AI 消息 ==========
            const playVoice = async (text, index) => {
                if (!text || text.trim() === '') return;

                function cleanTextForTTS(rawText) {
                    if (!rawText) return '';
                    let t = rawText
                        .replace(/\([^)]*\)/g, '')
                        .replace(/（[^）]*）/g, '')
                        .replace(/\[[^\]]*\]/g, '')
                        .replace(/【[^】]*】/g, '')
                        .replace(/\{[^}]*\}/g, '')
                        .replace(/<[^>]*>/g, '')
                        .replace(/\*\*/g, '')
                        .replace(/\*/g, '')
                        .replace(/#{1,6}\s*/g, '')
                        .replace(/`{1,3}[^`]*`{1,3}/g, '')
                        .replace(/\n+/g, '。')
                        .replace(/\s+/g, ' ')
                        .trim();

                    if (t.length === 0) return '(无对话内容)';
                    if (t.length > 1000) t = t.substring(0, 1000) + '。';
                    return t;
                }

                const cleanedText = cleanTextForTTS(text);
                if (cleanedText === '(无对话内容)') {
                    alert("当前对话内容为空，无法播放语音。");
                    return;
                }

                messages.value[index].isPlaying = true;
                try {
                    const res = await fetch('/api/tts', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text: cleanedText })
                    });

                    if (!res.ok) throw new Error(`播放语音失败：${res.status}`);

                    const data = await res.json();
                    if (!data.audio_url) throw new Error("audio_url not found");

                    const audio = new Audio(data.audio_url);
                    audio.onended = () => {
                        messages.value[index].isPlaying = false;
                    };
                    audio.onerror = () => {
                        alert("播放失败，请稍后再试");
                        messages.value[index].isPlaying = false;
                    };
                    await audio.play();
                } catch (error) {
                    console.error("语音合成请求失败:", error);
                    alert("请求失败：" + error.message);
                    messages.value[index].isPlaying = false;
                }
            };

            // ========== 语音通话 ==========

            // 建立 WebSocket 通道
            const connectVoiceChannel = () => {
                try {
                    const wsUrl = `ws://${window.location.hostname}:8081/voice`;
                    ws.value = new WebSocket(wsUrl);

                    ws.value.onopen = () => {
                        wsReady.value = true;
                        console.log('语音通道已连接:', wsUrl);
                    };
                    ws.value.onmessage = (event) => {
                        try {
                            const data = JSON.parse(event.data);
                            handleVoiceMessage(data);
                        } catch (error) {
                            console.error("解析 WebSocket 消息失败:", error);
                        }
                    };
                    ws.value.onerror = (e) => console.error('WebSocket 错误', e);
                    ws.value.onclose = () => {
                        wsReady.value = false;
                        isInCall.value = false;
                    };
                } catch (error) {
                    console.error("连接语音通道失败:", error);
                }
            };

            // 处理服务端返回
            const handleVoiceMessage = (data) => {
                if (data.type === 'reply') {
                    messages.value.push({
                        role: 'assistant',
                        content: data.text || '无响应',
                        isPlaying: false
                    });
                    scrollToBottom();
                    updateLocalSessionPreview(currentSessionId.value, data.text);

                    isAiSpeaking.value = true;
                    if (recognition.value) {
                        try { recognition.value.stop(); } catch (e) {}
                    }

                    const resumeRecognition = () => {
                        isAiSpeaking.value = false;
                        if (isInCall.value && recognition.value) {
                            try { recognition.value.start(); } catch (e) {}
                        }
                    };

                    if (data.audio_url) {
                        const audio = new Audio(data.audio_url);
                        audio.onended = resumeRecognition;
                        audio.onerror = () => {
                            console.error('音频播放失败');
                            resumeRecognition();
                        };
                        audio.play().catch(e => {
                            console.error('播放错误', e);
                            resumeRecognition();
                        });
                    } else {
                        resumeRecognition();
                    }
                } else if (data.type === 'error') {
                    console.error('服务端错误:', data.message);
                }
            };

            // 开始通话
            const startCall = () => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    alert("您的浏览器不支持语音识别功能，请使用 Chrome 或 Edge");
                    return;
                }
                if (!wsReady.value) {
                    alert("语音通道未连接，请稍后再试");
                    return;
                }
                if (!currentSessionId.value) {
                    alert("请先选择会话");
                    return;
                }

                const rec = new SpeechRecognition();
                rec.lang = 'zh-CN';
                rec.continuous = false;
                rec.interimResults = false;
                rec.maxAlternatives = 1;

                rec.onresult = (event) => {
                    if (isAiSpeaking.value) {
                        console.log('AI 播放中，忽略识别结果');
                        return;
                    }

                    const last = event.results.length - 1;
                    const text = event.results[last][0].transcript.trim();
                    if (!text) return;
                    console.log("识别到的文本:", text);

                    messages.value.push({ role: 'user', content: text });
                    scrollToBottom();

                    ws.value.send(JSON.stringify({
                        type: 'chat',
                        text: text,
                        session_id: currentSessionId.value
                    }));
                };

                rec.onerror = (e) => {
                    if (e.error === 'no-speech') {
                        if (isInCall.value && !isAiSpeaking.value) {
                            try { rec.start(); } catch (err) {}
                        }
                    } else {
                        console.error('识别错误:', e.error);
                    }
                };

                rec.onend = () => {
                    if (isInCall.value && !isAiSpeaking.value) {
                        try { rec.start(); } catch (e) {}
                    }
                };

                try {
                    rec.start();
                    recognition.value = rec;
                    isInCall.value = true;
                } catch (e) {
                    console.error('启动识别错误:', e);
                }
            };

            // 挂断
            const hangUpCall = () => {
                if (recognition.value) {
                    try { recognition.value.stop(); } catch (e) {}
                    recognition.value = null;
                }
                isAiSpeaking.value = false;
                isInCall.value = false;
            };

            const toggleVoiceCall = () => {
                if (isInCall.value) hangUpCall();
                else startCall();
            };

            // ========== 生命周期 ==========
            onMounted(() => {
                fetchSessions();
                connectVoiceChannel();
                window.addEventListener('beforeunload', () => {
                    hangUpCall();
                    if (ws.value) ws.value.close();
                });
            });

            return {
                sessions, currentSessionId, messages, inputMessage, isLoading,
                showPersonalityModal, showSummaryModal, tempPersonality, currentSummary,
                switchSession, createNewSession, sendMessage, updatePersonality,
                clearHistory, openSummary, deleteSession, formatTime, playVoice,
                isInCall, toggleVoiceCall
            };
        }
    }).mount('#app');
</script>
</body>
</html>
